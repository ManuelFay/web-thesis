name: Build and deploy thesis

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install website dependencies
        run: npm ci

      - name: Fingerprint PDF sources
        run: |
          mkdir -p dist
          git ls-files -z -- '*.tex' '*.bib' '*.cls' '*.sty' '*.bst' images tables \
            | sort -z \
            | xargs -0 sha256sum \
            | sha256sum \
            | cut -d ' ' -f 1 > dist/pdf-source.sha256
          echo "PDF source fingerprint: $(tr -d '\n' < dist/pdf-source.sha256)"

      - name: Reuse currently published PDF
        id: published_pdf
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          PDF_URL: https://manuelfay.github.io/Manuel-s-Thesis/Thesis.pdf
          FINGERPRINT_URL: https://manuelfay.github.io/Manuel-s-Thesis/pdf-source.sha256
        run: |
          curl --fail --location --retry 3 --retry-all-errors \
            --output /tmp/published-pdf-source.sha256 \
            "$FINGERPRINT_URL?commit=$GITHUB_SHA"
          cmp dist/pdf-source.sha256 /tmp/published-pdf-source.sha256
          curl --fail --location --retry 3 --retry-all-errors \
            --output dist/Thesis.pdf \
            "$PDF_URL?commit=$GITHUB_SHA"
          test -s dist/Thesis.pdf

      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Install TeX Live
        if: github.event_name != 'push' || steps.published_pdf.outcome != 'success'
        run: sudo apt-get install -y texlive-full

      - name: Increase TeX parameter stack size
        if: github.event_name != 'push' || steps.published_pdf.outcome != 'success'
        run: |
          mkdir -p ~/.texmf/web2c
          printf '\nparam_size=100000\n' >> ~/.texmf/web2c/texmf.cnf
          mktexlsr

      - name: Compile thesis PDF
        if: github.event_name != 'push' || steps.published_pdf.outcome != 'success'
        run: |
          mkdir -p build/chapters dist
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=build main.tex
          cp build/main.pdf dist/Thesis.pdf

      - name: Build and validate website
        env:
          BASE_PATH: /Manuel-s-Thesis
          SITE_URL: https://manuelfay.github.io
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run check

      - name: Record PDF source fingerprint
        run: cp dist/pdf-source.sha256 dist-web/pdf-source.sha256

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
