name: Build and deploy thesis

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install website dependencies
        run: npm ci

      - name: Install TeX Live and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full poppler-utils

      - name: Increase TeX parameter stack size
        run: |
          mkdir -p ~/.texmf/web2c
          printf '\nparam_size=100000\n' >> ~/.texmf/web2c/texmf.cnf
          mktexlsr

      - name: Compile thesis PDF
        run: |
          mkdir -p build/chapters dist
          latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=build main.tex
          cp build/main.pdf dist/Thesis.pdf

      - name: Build and validate website
        env:
          BASE_PATH: /Manuel-s-Thesis
          SITE_URL: https://manuelfay.github.io
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run check

      - name: Upload standalone PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: dist/Thesis.pdf
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
