name: Build LaTeX document

on:
  push:

permissions:
  contents: read

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: LaTeX pass 1 (generate .bcf)
        uses: xu-cheng/texlive-action@v4
        continue-on-error: true
        with:
          run: pdflatex -file-line-error -interaction=nonstopmode main.tex

      - name: Run biber (build bibliography)
        uses: xu-cheng/texlive-action@v4
        continue-on-error: true
        with:
          run: biber main

      - name: LaTeX pass 2 (resolve citations)
        uses: xu-cheng/texlive-action@v4
        continue-on-error: true
        with:
          run: pdflatex -file-line-error -interaction=nonstopmode main.tex

      - name: LaTeX pass 3 (finalize output)
        uses: xu-cheng/texlive-action@v4
        continue-on-error: true
        with:
          run: pdflatex -file-line-error -interaction=nonstopmode main.tex

      - name: Rename PDF (optional)
        run: mv main.pdf Thesis.pdf

      - name: Upload PDF file
        uses: actions/upload-artifact@v4
        with:
          name: PDF
          path: Thesis.pdf
          if-no-files-found: error
